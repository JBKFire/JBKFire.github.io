<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple text to hexadecimal encoder.">
    <title>Hex Encoder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Hex Encoder</h1>

        <p class="subtitle">
            Convert text into <code>\xNN</code> hexadecimal strings.
        </p>

        <label for="input">Input</label>
        <textarea
            id="input"
            placeholder="Enter text here..."
            aria-label="Text to encode"
        ></textarea>

        <div class="buttons">
            <button type="button" id="encode">Encode</button>
            <button type="button" id="clear" class="secondary">Clear</button>
        </div>

        <label for="output">Output</label>

        <div class="output-container">
            <textarea
                id="output"
                readonly
                placeholder="Your hexadecimal output will appear here..."
                aria-label="Hexadecimal output"
            ></textarea>

            <button type="button" id="copy" class="copy-button">
                Copy
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
